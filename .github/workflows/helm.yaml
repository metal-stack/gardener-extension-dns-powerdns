---
name: Helm Chart Release Action
on:
  pull_request:
    branches:
        - main
  release:
    types:
        - published
  push:
    branches:
        - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Make tag
          run: |
            [ "${GITHUB_EVENT_NAME}" == 'pull_request' ] && echo "tag=v0.0.0-pull-request.${{ github.event.number }}" >> $GITHUB_ENV || true
            [ "${GITHUB_EVENT_NAME}" == 'release' ] && echo "tag=${GITHUB_REF##*/}" >> $GITHUB_ENV || true
            [ "${GITHUB_EVENT_NAME}" == 'push' ] && echo "tag=v0.0.0-develop" >> $GITHUB_ENV || true

            # replacing container image tags in values.yaml

            if ! which yq; then
              sudo curl -Lo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
              sudo chmod +x /usr/local/bin/yq
            fi

            [ "${GITHUB_EVENT_NAME}" == 'pull_request' ] && docker_tag=${GITHUB_HEAD_REF##*/} || true
            [ "${GITHUB_EVENT_NAME}" == 'release' ] && docker_tag=${GITHUB_REF##*/} || true
            [ "${GITHUB_EVENT_NAME}" == 'push' ] && docker_tag=latest|| true

            yq e -ij ".image.tag=\"${docker_tag}\"" charts/gardener-extension-dns-powerdns/values.yaml
            yq e '.image.tag' charts/gardener-extension-dns-powerdns/values.yaml

        # we can replace this with the helm/chart-releaser-action after
        # https://github.com/helm/chart-releaser-action/issues/107 was resolved
        - name: Release Helm OCI Artifact
          uses: appany/helm-oci-chart-releaser@v0.4.2
          with:
            name: gardener-extension-dns-powerdns
            repository: ${{ github.repository_owner }}/charts
            tag: ${{ env.tag }}
            path: charts/gardener-extension-dns-powerdns
            registry: ${{ env.REGISTRY }}
            registry_username: ${{ secrets.DOCKER_REGISTRY_USER }}
            registry_password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
