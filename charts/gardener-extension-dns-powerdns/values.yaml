image:
  repository: ghcr.io/metal-stack/gardener-extension-dns-powerdns
  tag: latest
  pullPolicy: Always

replicaCount: 1
maxUnavailable: 1
maxSurge: 50%

resources: {}

metricsPort: 8080
healthPort: 8081

controllers:
  dnsrecord:
    concurrentSyncs: 5
  heartbeat:
    renewIntervalSeconds: 30
  ignoreOperationAnnotation: false

disableControllers: []
disableWebhooks: []
ignoreResources: false

## settings for metrics, e.g. scraping by seed-prometheus
##
metrics:
  ## enable metrics scraping
  ##
  enableScraping: true

config:
  clientConnection:
    acceptContentTypes: application/json
    contentType: application/json
    qps: 100
    burst: 130

gardener:
  version: ""

# this allows the connection to a powerdns namespace in the cluster (namespaced not governed by the Gardener)
networkPolicies:
  enabled: false
  powerDNS:
    namespace: powerdns
    podSelector:
      app: powerdns
